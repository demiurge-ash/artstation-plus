<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <title>Artstation Plus — Download images</title>
    <link rel="stylesheet" type="text/css" href="/css/styles.css">
    <link rel="stylesheet" type="text/css" href="/ui/download.css">
</head>

<body>

<div class="modal-header">
    <button aria-label="Close" class="close" id="close" type="button"><div class="art-plus-icon art-plus-close art-plus-icon-lg"></div></button>
    <h3 class="modal-title">Artstation Plus — Download images</h3>
</div>

<div class="modal-body">

    <div id="search">
        <div id="found-spin" class="art-plus-icon art-plus-loading art-plus-icon-lg art-plus-icon-spin art-plus-spin-fix"></div>
        Searching for images...
    </div>

    <div id="found" class="none">
        Found <span id="found-count">0</span> images.
    </div>

    <div id="found-nothing" class="none">
        <i>Images not found!</i>
    </div>

    <div id="error" class="none" role="alert"></div>

    <div id="total" class="none">
        Total size: <span id="total-count">0</span>.
    </div>

    <div id="download" class="none">
        Download to folder «<span id="username" style="font-weight: bold;"></span>».
    </div>

    <div id="download-status" class="none" role="status"></div>

    <div id="progress" role="progressbar" aria-label="Downloaded images" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>

    <div id="done" class="none">
        <span id="done-message">Well done!</span> <a class="show-folder none">Open Folder</a>
    </div>

    <button id="cancel" type="button">Cancel</button>
    <div class="close-hint">Closing stops the queue; active downloads continue in Chrome.</div>

    <details id="failures" class="none">
        <summary>Errors</summary>
        <ul id="failure-list"></ul>
        <div id="failure-limit" class="none">Showing the first 20 errors.</div>
    </details>

</div>

<script src="/js/api.js"></script>
<script src="download.js"></script>
</body>
</html>
